services:
  - type: web
    name: smart-boda-api
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-boda-db
          property: connectionString
      - key: DB_SCHEMA
        value: "smart_cabz"
      - key: JWT_SECRET_KEY
        value: "iwillrestoreuntoyoualltheyearsthathavebeenlost"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
